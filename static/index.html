<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seawater Intrusion Calculator</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<header class="top">
  <h1>Seawater intrusion with a cutoff wall</h1>
  <p class="sub">Analytical solution of Sun et al. (2026), Advances in Water Resources 212, 105301. Confined aquifer, constant inland flux, no mixing correction.</p>
</header>
<nav class="tabs" role="tablist" aria-label="Aquifer type">
  <button role="tab" aria-selected="true" data-tab="confined">Confined</button>
  <button role="tab" aria-selected="false" tabindex="-1" data-tab="unconfined">Unconfined</button>
  <button role="tab" aria-selected="false" tabindex="-1" data-tab="other">Other aquifer types</button>
</nav>
<main>
  <section id="panel-confined" class="calc">
    <form id="form" class="inputs" novalidate autocomplete="off">
      <div id="fields"></div>
      <div class="actions">
        <button type="button" id="btn-calc" class="primary">Process output</button>
        <button type="button" id="btn-snap">Download snapshot</button>
        <button type="button" id="btn-reset" class="link">Reset to defaults</button>
      </div>
    </form>
    <section class="results" aria-live="polite">
      <h2>Output</h2>
      <div id="status" class="status" role="status" hidden></div>
      <div id="out"></div>
      <div id="graph-wrap" hidden>
        <div class="ghead">
          <h3 id="gtitle">Interface profile</h3>
          <button type="button" id="info-btn" class="info" aria-expanded="false" aria-controls="info" aria-label="About this graph">i</button>
        </div>
        <div id="info" class="infobox" hidden></div>
        <div id="plot"></div>
      </div>
    </section>
  </section>
  <section id="panel-unconfined" class="stub" hidden><h2>Unconfined aquifer</h2><p>To be built.</p></section>
  <section id="panel-other" class="stub" hidden><h2>Other aquifer types</h2><p>To be built.</p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
